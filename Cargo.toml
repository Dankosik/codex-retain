[package]
name = "rust-cli-template"
version = "0.1.0"
edition = "2024"
rust-version = "1.85.1"
description = "A fast, small Rust command-line utility."
license = "MIT"
repository = "https://github.com/Dankosik/rust-cli-template"
publish = false

[dependencies]
clap = { version = "4.6.6", features = ["derive", "env"] }
clap_complete = "4.6.9"
memchr = "2.8.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
toml = { version = "1.1.5", default-features = false, features = ["parse", "serde", "std"] }

[dev-dependencies]
tempfile = "3.27.0"

[lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
strip = "debuginfo"

[profile.profiling]
inherits = "release"
debug = 1
strip = "none"
