[package]
name = "codex-retain"
version = "0.1.2"
edition = "2024"
rust-version = "1.98.1"
description = "Predictable local retention for archived Codex chats."
license = "MIT"
repository = "https://github.com/Dankosik/codex-retain"
publish = false

[dependencies]
# Shared CLI infrastructure.
clap = { version = "4.6.6", features = ["derive", "env"] }
clap_complete = "4.6.9"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

# Selected filesystem, SQLite, identity and timestamp capabilities.
anyhow = "1.0.104"
tempfile = "3.27.0"
walkdir = "2.5.0"
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }
uuid = { version = "1.26.0", features = ["serde"] }
zstd = { version = "0.14.0", default-features = false }
rustix = { version = "1.1.4", features = ["fs"] }
jiff = { version = "0.2.35", default-features = false, features = ["std"] }

[dev-dependencies]
assert_cmd = "2.2.2"

[lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
strip = "debuginfo"

[profile.profiling]
inherits = "release"
debug = 1
strip = "none"
